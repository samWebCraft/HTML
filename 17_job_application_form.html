<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>job application form</title>
</head>
<body>
    <h1>Job Application Form</h1>
    <form>
        <fieldset>
        <legend><h3>Personal Details</h3></legend>
        
        <label for ="name">Full Name:</label>
        <input type="text" id="full_name" name="full_name"><br><br>

        
        <label for ="father_name">Father's Name:</label>
        <input type="text" id="father_name" name="father_name"><br><br>

        <label for ="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">Female</label>
        <input type="radio" name="gender" value="other" id="other">
        <label for="other">Other</label><br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="material status">Material Status:</label>
        <select>
            <option>select</option>
            <option>single</option>
            <option>married</option>
        </select>
        </fieldset>
      
        <fieldset>
            <legend><h3>Educational Details</h3></legend>

        <label for="10th percentage">10th Percentage:</label>
        <input type="number" id="10th percentage" name="10th percentage"><br><br>

        <label for="12th percentage">12th Percentage:</label>
        <input type="number" id="12th percentage" name="12th percentage"><br><br>

        <label for="graduation">Graduation:</label>
        <input type="text" id="graduation" name="graduation"><br><br>

        <label for="university">university:</label>
        <input type="text" id="university" name="university"><br><br>

        <label for="passing year">Passing Year:</label>
        <input type="number" id="passing year" name="passing year"><br><br>

        <label for="additional qualification">Additional Qualifications:</label>
        <input type="text" id="additional qualification" name="additional qualification"><br><br>
        </fieldset>


        <fieldset>
            <legend><h3>Experience Details</h3></legend>

        <label for="total experience">Total Experience:</label>
        <input type="number" id="total experience" name="total experience"><br><br>

        <label for="current company">Current Company:</label>
        <input type="text" id="current company" name="current company"><br><br>

        <label for="designation">Designation:</label>
        <input type="text" id="designation" name="designation"><br><br>

        <label for="current salary">Current Salary:</label>
        <input type="number" id="current salary" name="current salary"><br><br>

        <label for="skills">Skills:</label>
        <input type="text" id="skills" name="skills"><br><br>
        </fieldset>

        <fieldset>
        <legend><h3>Address Details</h3></legend>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address"><br><br>

        <label for="city">City:</label>
        <input type="text" id="city" name="city"><br><br>

        <label for="state">State:</label>
        <input type="text" id="state" name="state"><br><br>

        <label for="pin code">Pin Code:</label>
        <input type="text" id="pin code" name="pin code"><br><br>

        <label for="country">Country:</label>
        <input type="text" id="country" name="country"><br><br>
        </fieldset>
 
        <fieldset>
        <legend><h3>Photo & Signature</h3></legend>

        <label for="upload photo">upload photo</label>
        <input type="file" id="upload photo" name="upload photo"><br><br>

        <label for="upload signature">upload signature</label>
        <input type="file" id="upload signature" name="upload signature"><br><br>
        </fieldset>

        <fieldset>
            <legend><h3>Required Documents</h3></legend>

            <label for="resume/CV">resume/CV:</label>
            <input type="file" id="resume/CV" name="resume/CV"><br><br>

            <label for="adhaar card">adhaar card:</label>
            <input type="file" id="adhaar card" name="adhaar card"><br><br>

            <label for="pan card">pan card:</label>
            <input type="file" id="pan card" name="pan card"><br><br>

            <label for="10th marksheet">10th Marksheet:</label>
            <input type="file" id="10th marksheet" name="10th marksheet"><br><br>

            <label for="12th marksheet">12th Marksheet:</label>
            <input type="file" id="12th marksheet" name="12th marksheet"><br><br>

            <label for="graduation certificate">Graduation Certificate:</label>
            <input type="file" id="graduation certificate" name="graduation certificate"><br><br>

            <label for="experience certificate">Experience Certificate:</label>
            <input type="file" id="experience certificate" name="experience certificate"><br><br>

            <label for="other documents">Other Documents:</label>
            <input type="file" id="other documents" name="other documents"><br><br>
            </fieldset>

            <fieldset>
                <legend><h3>Declaration</h3></legend>
                <input type="checkbox" id="declaration" name="declaration">
                <label for="declaration">I hereby declare that the information provided in this application is true and correct to the best of my knowledge.</label><br><br>
           
                 <input type="submit" name="submit" value="Submit">
                 <input type="reset" value="Reset"> 
            </fieldset>

    </form>
</body>
</html>
