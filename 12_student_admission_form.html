<!DOCTYPE html> 
<html> 
<head> 
    <title>Student Registration</title> 
</head> 
<body> 
 
<h1>Student Registration Form</h1> 
 
<form> 
    <label for="student name"> student name:</label>
   <input type="text" name="student_name" id="student_name" placeholder="enter your name"><br><br>

    <label for="fathers name">fathers name:</label>
    <input type="text" name="father_name" id="father_name" placeholder="enter father name"><br><br> 
 
    mother's name:
    <input type="text" name="mother_name" id="mother_name" placeholder="enter mother name"><br><br> 
    
    Email: 
    <input type="email" name="email" id="email"><br><br> 

    Mobile no:
    <input type="tel" name="mobile" id="mobile"><br><br>

    Gender: 
   <input type="radio" name="gender" value="male" id="male">
   <label for="male">Male</label>
   <input type="radio" name="gender" value="female" id="female">
   <label for="female">Female</label><br><br>

     DOB: 
    <input type="date" id="dob"><br><br>

    <label for="course">Course:</label>
    <select name="course" id="course"> 
        <option>IT</option> 
        <option>cs</option> 
        <option>ej</option> 
    </select> <br><br>

    Hobbies: 
    <input type="checkbox"> Reading 
    <input type="checkbox"> Sports 
    <input type="checkbox"> Music <br><br> 
 
    Address: 
    <textarea rows="2" cols="30"></textarea> <br><br> 

    <label for="#">Upload photo:</label>
    <input type="file" name="#" id="#" placeholder="Upload your photo"> <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Reset"> 

 </form>
 </body>
</head>
</html>
