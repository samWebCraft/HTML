<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="800" height="500" fill="#f5f7fa"/>

  <!-- Floor -->
  <rect x="0" y="380" width="800" height="120" fill="#d6dbe0"/>

  <!-- Windows -->
  <rect x="50" y="50" width="180" height="120" fill="#b3e5fc" stroke="#78909c" stroke-width="4"/>
  <line x1="140" y1="50" x2="140" y2="170" stroke="#78909c" stroke-width="2"/>
  <line x1="50" y1="110" x2="230" y2="110" stroke="#78909c" stroke-width="2"/>

  <rect x="270" y="50" width="180" height="120" fill="#b3e5fc" stroke="#78909c" stroke-width="4"/>
  <line x1="360" y1="50" x2="360" y2="170" stroke="#78909c" stroke-width="2"/>
  <line x1="270" y1="110" x2="450" y2="110" stroke="#78909c" stroke-width="2"/>

  <!-- Desk -->
  <rect x="220" y="240" width="320" height="20" fill="#8d6e63"/>
  <rect x="240" y="260" width="15" height="120" fill="#6d4c41"/>
  <rect x="505" y="260" width="15" height="120" fill="#6d4c41"/>

  <!-- Computer -->
  <rect x="320" y="140" width="120" height="80" rx="5" fill="#263238"/>
  <rect x="330" y="150" width="100" height="60" fill="#90caf9"/>
  <rect x="375" y="220" width="10" height="20" fill="#455a64"/>
  <rect x="355" y="240" width="50" height="8" fill="#455a64"/>

  <!-- Keyboard -->
  <rect x="330" y="275" width="100" height="18" rx="3" fill="#cfd8dc"/>

  <!-- Chair -->
  <rect x="600" y="220" width="80" height="90" rx="8" fill="#1976d2"/>
  <rect x="625" y="310" width="30" height="40" fill="#455a64"/>
  <line x1="640" y1="350" x2="610" y2="380" stroke="#455a64" stroke-width="4"/>
  <line x1="640" y1="350" x2="670" y2="380" stroke="#455a64" stroke-width="4"/>

  <!-- Employee -->
  <circle cx="120" cy="260" r="30" fill="#ffcc99"/>
  <rect x="95" y="290" width="50" height="70" fill="#42a5f5"/>
  <line x1="95" y1="310" x2="70" y2="340" stroke="#ffcc99" stroke-width="8"/>
  <line x1="145" y1="310" x2="170" y2="340" stroke="#ffcc99" stroke-width="8"/>
  <line x1="110" y1="360" x2="110" y2="400" stroke="#263238" stroke-width="8"/>
  <line x1="130" y1="360" x2="130" y2="400" stroke="#263238" stroke-width="8"/>

  <!-- Plant -->
  <rect x="700" y="300" width="50" height="50" fill="#8d6e63"/>
  <ellipse cx="725" cy="270" rx="30" ry="40" fill="#4caf50"/>
  <ellipse cx="710" cy="250" rx="18" ry="28" fill="#66bb6a"/>
  <ellipse cx="740" cy="250" rx="18" ry="28" fill="#66bb6a"/>

  <!-- Clock -->
  <circle cx="650" cy="90" r="35" fill="white" stroke="#757575" stroke-width="3"/>
  <line x1="650" y1="90" x2="650" y2="70" stroke="#000" stroke-width="3"/>
  <line x1="650" y1="90" x2="665" y2="100" stroke="#000" stroke-width="3"/>

  <!-- Office Label -->
  <text x="400" y="40" text-anchor="middle"
        font-size="28" font-family="Arial" fill="#37474f">
    OFFICE WORKSPACE
  </text>

</svg>
</body>
</html>
