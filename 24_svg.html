<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog SVG</title>
</head>
<body>
    <svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <ellipse cx="200" cy="170" rx="90" ry="55" fill="#C68642"/>

  <!-- Head -->
  <circle cx="100" cy="130" r="50" fill="#C68642"/>

  <!-- Ears -->
  <ellipse cx="65" cy="95" rx="18" ry="35" fill="#8B5A2B" transform="rotate(-20 65 95)"/>
  <ellipse cx="135" cy="95" rx="18" ry="35" fill="#8B5A2B" transform="rotate(20 135 95)"/>

  <!-- Eyes -->
  <circle cx="85" cy="120" r="5" fill="black"/>
  <circle cx="115" cy="120" r="5" fill="black"/>

  <!-- Nose -->
  <ellipse cx="100" cy="145" rx="10" ry="7" fill="black"/>

  <!-- Mouth -->
  <path d="M90 155 Q100 165 110 155" stroke="black" stroke-width="2" fill="none"/>

  <!-- Legs -->
  <rect x="140" y="210" width="15" height="55" fill="#C68642"/>
  <rect x="180" y="210" width="15" height="55" fill="#C68642"/>
  <rect x="220" y="210" width="15" height="55" fill="#C68642"/>
  <rect x="260" y="210" width="15" height="55" fill="#C68642"/>

  <!-- Paws -->
  <ellipse cx="147" cy="270" rx="12" ry="6" fill="#8B5A2B"/>
  <ellipse cx="187" cy="270" rx="12" ry="6" fill="#8B5A2B"/>
  <ellipse cx="227" cy="270" rx="12" ry="6" fill="#8B5A2B"/>
  <ellipse cx="267" cy="270" rx="12" ry="6" fill="#8B5A2B"/>

  <!-- Tail -->
  <path d="M285 150 Q340 100 320 60" stroke="#C68642" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Collar -->
  <rect x="65" y="165" width="70" height="10" fill="red"/>
  <circle cx="100" cy="180" r="6" fill="gold"/>
</svg>
</body>
</html>
